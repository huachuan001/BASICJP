name: Backend Tests

on:
  pull_request:
    branches: [ "*" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests with coverage
        working-directory: backend
        run: mvn -B -e clean test

      - name: Generate Markdown test summary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Aggregate surefire results
          RUN=0; FAIL=0; ERR=0; SKIP=0
          while read -r line; do
            r=$(echo "$line" | sed -n 's/.*Tests run: \([0-9]\+\).*/\1/p')
            f=$(echo "$line" | sed -n 's/.*Failures: \([0-9]\+\).*/\1/p')
            e=$(echo "$line" | sed -n 's/.*Errors: \([0-9]\+\).*/\1/p')
            s=$(echo "$line" | sed -n 's/.*Skipped: \([0-9]\+\).*/\1/p')
            RUN=$((RUN + r))
            FAIL=$((FAIL + f))
            ERR=$((ERR + e))
            SKIP=$((SKIP + s))
          done < <(grep -h "Tests run:" backend/target/surefire-reports/*.txt)

          # Coverage from JaCoCo XML
          LINE_MISSED=$(grep -o '<counter type="LINE"[^>]*/>' backend/target/site/jacoco/jacoco.xml | head -1 | sed -n 's/.*missed="\([0-9]\+\)".*/\1/p')
          LINE_COVERED=$(grep -o '<counter type="LINE"[^>]*/>' backend/target/site/jacoco/jacoco.xml | head -1 | sed -n 's/.*covered="\([0-9]\+\)".*/\1/p')
          TOTAL=$((LINE_MISSED + LINE_COVERED))
          PCT=0
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(( (100 * LINE_COVERED) / TOTAL ))
          fi

          echo "### Backend Unit Test Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "- **Tests run**: $RUN" >> test-summary.md
          echo "- **Failures**: $FAIL" >> test-summary.md
          echo "- **Errors**: $ERR" >> test-summary.md
          echo "- **Skipped**: $SKIP" >> test-summary.md
          echo "- **Line coverage**: ${PCT}% (covered $LINE_COVERED / total $TOTAL)" >> test-summary.md
          echo "" >> test-summary.md
          if [ "$FAIL" -ne 0 ] || [ "$ERR" -ne 0 ]; then
            echo "> ❌ Some tests failed. MR/PR is blocked." >> test-summary.md
          else
            echo "> ✅ All tests passed. Coverage gate enforced at 100%." >> test-summary.md
          fi

          # Also write to job summary for visibility regardless of comment permissions
          echo "## Backend Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          cat test-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Generate detailed test case table (Markdown)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 - <<'PY'
import glob
import os
import xml.etree.ElementTree as ET

reports = glob.glob('backend/target/surefire-reports/TEST-*.xml')
rows = []
for rp in reports:
    try:
        tree = ET.parse(rp)
        root = tree.getroot()
        # Support both <testsuite> as root or <testsuites>
        suites = []
        if root.tag.endswith('testsuite'):
            suites = [root]
        else:
            suites = [s for s in root.findall('.//testsuite')]
        for suite in suites:
            for tc in suite.findall('.//testcase'):
                classname = tc.attrib.get('classname','')
                name = tc.attrib.get('name','')
                time = tc.attrib.get('time','0')
                status = 'PASS'
                message = ''
                skipped = tc.find('skipped')
                failure = tc.find('failure')
                error = tc.find('error')
                if skipped is not None:
                    status = 'SKIPPED'
                    message = (skipped.attrib.get('message') or '').strip()
                elif failure is not None:
                    status = 'FAIL'
                    message = (failure.attrib.get('message') or '').strip()
                    if not message:
                        txt = (failure.text or '').strip().splitlines()
                        message = txt[0] if txt else ''
                elif error is not None:
                    status = 'ERROR'
                    message = (error.attrib.get('message') or '').strip()
                    if not message:
                        txt = (error.text or '').strip().splitlines()
                        message = txt[0] if txt else ''
                rows.append((classname, name, status, time, message))
    except Exception as e:
        pass

out = []
out.append('\n#### Detailed Test Cases')
out.append('\n| Class | Test | Status | Time (s) | Message |')
out.append('|---|---|---:|---:|---|')
for classname, name, status, time, message in sorted(rows):
    # Escape pipes
    cname = classname.replace('|','\\|')
    tname = name.replace('|','\\|')
    msg = (message or '').replace('\n',' ').replace('|','\\|')
    out.append(f"| {cname} | {tname} | {status} | {time} | {msg} |")

with open('test-details.md', 'w', encoding='utf-8') as f:
    f.write('\n'.join(out) + '\n')
PY
          # Append to main summary file
          cat test-details.md >> test-summary.md
          echo "" >> $GITHUB_STEP_SUMMARY
          cat test-details.md >> $GITHUB_STEP_SUMMARY

      - name: Comment test summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: test-summary.md

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco


