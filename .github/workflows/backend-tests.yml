name: Backend Tests

on:
  pull_request:
    branches: [ "*" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests with coverage
        working-directory: backend
        run: mvn -B -e clean test

      - name: Publish JUnit Test Report (summary + PR comment)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'backend/target/surefire-reports/TEST-*.xml'
          check_name: 'Backend Unit Tests'
          annotate_only: false
          detailed_summary: true
          include_passed: true
          fail_on_failure: true

      - name: Generate coverage summary markdown
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/target/site/jacoco/jacoco.xml
          badge: true
          format: markdown
          output: both
          output_file: coverage-summary.md

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: coverage-summary.md

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco


