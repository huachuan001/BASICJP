name: Backend Tests

on:
  pull_request:
    branches: [ "*" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests with coverage
        working-directory: backend
        run: mvn -B -e clean test jacoco:report jacoco:check

      - name: Generate PR Markdown summary (tests + coverage)
        if: always()
        run: |
          python3 .github/scripts/gen_test_summary.py backend/target/surefire-reports backend/target/site/jacoco/jacoco.xml pr-test-summary.md
          echo "## Backend Unit Tests" >> $GITHUB_STEP_SUMMARY
          cat pr-test-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: pr-test-summary.md

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco


