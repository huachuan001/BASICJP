name: E2E Tests

on:
  pull_request:
    branches: [ "**" ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build backend
        working-directory: backend
        run: mvn -q -DskipTests package

      - name: Start backend
        working-directory: backend
        run: nohup java -jar target/accounting-system-1.0.0.jar >/dev/null 2>&1 & echo $! > backend.pid

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: npm run start &

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null; then echo frontend up; break; fi; sleep 2; done
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then echo backend up; break; fi; sleep 2; done

      - name: Run E2E tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test --reporter=html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Save summary
        if: always()
        run: |
          echo "### Playwright E2E Results" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: playwright-report" >> $GITHUB_STEP_SUMMARY

      - name: PR comment with results
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            Playwright E2E completed. Download the report from the workflow artifacts named "playwright-report".
            Status: ${{ job.status }}


