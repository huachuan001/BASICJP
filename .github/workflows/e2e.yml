name: PR E2E Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install backend deps and build
        working-directory: backend
        run: |
          ./mvnw -q -DskipTests package || mvn -q -DskipTests package

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          java -jar backend/target/accounting-system-1.0.0.jar &
          echo $! > backend.pid
        shell: bash

      - name: Wait for backend
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              echo "Backend is up"; exit 0; fi; sleep 2; done
          echo "Backend failed to start"; curl -v http://localhost:8080/actuator/health || true; exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          PORT: 3000
        run: |
          npm run build
          npm start &
          echo $! > ../frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              echo "Frontend is up"; exit 0; fi; sleep 2; done
          echo "Frontend failed to start"; curl -v http://localhost:3000 || true; exit 1

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e -- --reporter=list,github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Kill services
        if: always()
        run: |
          kill $(cat backend.pid) 2>/dev/null || true
          kill $(cat frontend.pid) 2>/dev/null || true

      - name: Comment test result on PR
        if: always()
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            E2E 运行完成：${{ job.status }}
            - 报告下载：见 Actions Artifacts 中的 playwright-report
            - 触发工作流：${{ github.workflow }} / Run: ${{ github.run_id }}
          comment_includes: 'E2E 运行完成：'
          pr_number: ${{ github.event.pull_request.number }}


